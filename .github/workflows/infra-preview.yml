# Sur chaque PR qui touche l'infra : montre ce que Terraform changerait (plan, lecture seule) avant la fusion.
name: Infra preview
on:
  pull_request:
    paths: ['infra/**', 'Dockerfile']

permissions:
  id-token: write
  contents: read
  pull-requests: read

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_IN_AUTOMATION: "true"
  TF_VAR_db_admin_password: ${{ secrets.MYREGISTRY_DB_ADMIN_PASSWORD }}
  TF_VAR_oidc_client_secret: ${{ secrets.MYREGISTRY_OIDC_CLIENT_SECRET }}

jobs:
  plan:
    runs-on: ubuntu-latest
    # base main -> prod ; base develop (ou autre) -> dev
    environment: ${{ github.base_ref == 'main' && 'prod' || 'dev' }}
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
      - name: Init
        env:
          TARGET: ${{ github.base_ref == 'main' && 'prod' || 'dev' }}
        run: terraform init -input=false -backend-config="envs/${TARGET}.backend.hcl"
      - name: "Plan (sans verrou, aucune écriture)"
        env:
          TARGET: ${{ github.base_ref == 'main' && 'prod' || 'dev' }}
        run: |
          terraform plan -input=false -lock=false -no-color -var-file="envs/${TARGET}.tfvars" | tee plan.txt
          { echo '### Plan Terraform ('"$TARGET"')'; echo '```'; tail -n 200 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
