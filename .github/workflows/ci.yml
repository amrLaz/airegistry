name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myregistry
          POSTGRES_PASSWORD: myregistry
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U myregistry" --health-interval 5s --health-retries 10
    env:
      MYREGISTRY_TEST_DB: Host=localhost;Username=myregistry;Password=myregistry;Database=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  infra-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bicep build (valide la syntaxe de main.bicep et des paramètres)
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          for f in infra/params/*.bicepparam; do az bicep build-params --file "$f" --stdout > /dev/null; done
